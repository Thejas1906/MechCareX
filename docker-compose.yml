version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: rotaryguard_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rotaryguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rotaryguard_secret}
      POSTGRES_DB: ${POSTGRES_DB:-rotaryguard}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rotaryguard}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
